<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SOS LIXO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="Css/login.css">
</head>
<body>
    <div class="login-container">
        <i class="fa-solid fa-leaf logo"></i>
        <h2>Acesso Administrativo</h2>
        <form id="loginForm">
            <input type="text" id="usuario" placeholder="Usuário" autocomplete="off" required>
            <input type="password" id="senha" placeholder="Senha" required>
            <button type="submit">Entrar no Painel</button>
            <div id="erroMsg" class="erro"></div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const usuario = document.getElementById('usuario').value;
            const senha = document.getElementById('senha').value;
            // Credencial padrão – pode ser alterada posteriormente
            if (usuario === 'admin' && senha === '123456') {
                localStorage.setItem('admin_logado', 'true');
                window.location.href = 'ReportAdm.html';
            } else {
                document.getElementById('erroMsg').innerText = 'Usuário ou senha inválidos!';
            }
        });
    </script>
</body>
</html>
