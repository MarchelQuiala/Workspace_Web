<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste - Menu Hambúrguer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        /* HEADER */
        header {
            background: #2E7D32;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }

        /* BOTÃO HAMBÚRGUER */
        .hamburger {
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hamburger:hover {
            background: rgba(255,255,255,0.2);
        }

        /* OVERLAY */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 998;
            display: none;
        }

        .overlay.active {
            display: block;
        }

        /* MENU LATERAL */
        .side-menu {
            position: fixed;
            top: 0;
            right: -300px;
            width: 280px;
            height: 100%;
            background: #1a4a2a;
            z-index: 999;
            transition: right 0.3s ease;
            padding: 20px;
        }

        .side-menu.open {
            right: 0;
        }

        .side-menu .close {
            background: none;
            border: none;
            font-size: 1.8rem;
            color: white;
            cursor: pointer;
            float: right;
        }

        .side-menu nav {
            margin-top: 60px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .side-menu a {
            color: white;
            text-decoration: none;
            padding: 10px;
            display: block;
            border-radius: 8px;
        }

        .side-menu a:hover {
            background: rgba(255,255,255,0.2);
        }

        .logout-btn {
            margin-top: 30px;
            background: #d32f2f;
            text-align: center;
            border-radius: 8px;
        }

        .logout-btn:hover {
            background: #b71c1c;
        }

        .content {
            padding: 40px;
            text-align: center;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">SOS LIXO</div>
    <button class="hamburger" id="hamburgerBtn">🍔</button>
</header>

<div class="overlay" id="overlay"></div>

<div class="side-menu" id="sideMenu">
    <button class="close" id="closeBtn">✕</button>
    <nav>
        <a href="#">Início</a>
        <a href="#">Mapa</a>
        <a href="#">Relatórios</a>
        <a href="#">Empresas</a>
        <a href="#">Dashboard</a>
        <a href="#">Ocorrências</a>
        <a href="#" class="logout-btn" id="logoutBtn">🚪 Sair</a>
    </nav>
</div>

<div class="content">
    <h1>Conteúdo Principal</h1>
    <p>Clique no hambúrguer para abrir o menu lateral</p>
</div>

<script>
    const hamburger = document.getElementById('hamburgerBtn');
    const sideMenu = document.getElementById('sideMenu');
    const overlay = document.getElementById('overlay');
    const closeBtn = document.getElementById('closeBtn');
    const logoutBtn = document.getElementById('logoutBtn');

    function openMenu() {
        sideMenu.classList.add('open');
        overlay.classList.add('active');
    }

    function closeMenu() {
        sideMenu.classList.remove('open');
        overlay.classList.remove('active');
    }

    hamburger.addEventListener('click', openMenu);
    closeBtn.addEventListener('click', closeMenu);
    overlay.addEventListener('click', closeMenu);

    logoutBtn.addEventListener('click', function() {
        alert('Logout executado! (aqui vai redirecionar para o login)');
        // window.location.href = 'login.html';
    });
</script>

</body>
</html>
