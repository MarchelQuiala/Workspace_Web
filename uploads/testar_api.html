<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Teste de Bancada - Clean City API</title>
</head>
<body>
    <h2>Testar Envio de Denúncia (Back-end)</h2>
    
    <form id="formTeste">
        <label>Descrição:</label><br>
        <textarea id="desc" required>Acúmulo de resíduos sólidos detectado.</textarea><br><br>

        <label>Coordenadas (Lat / Long):</label><br>
        <input type="number" step="any" id="lat" value="-12.3456" required>
        <input type="number" step="any" id="long" value="13.4567" required><br><br>

        <label>Selecione a Foto ou Vídeo:</label><br>
        <input type="file" id="arquivo" accept="image/*,video/*" required><br><br>

        <button type="submit">Enviar para o Servidor (Porta 3000)</button>
    </form>

    <hr>
    <h3>Resposta do Servidor:</h3>
    <pre id="resultado" style="background: #eee; padding: 10px;">Aguardando envio...</pre>

    <script>
        document.getElementById('formTeste').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pre = document.getElementById('resultado');
            pre.innerText = "Enviando arquivo para o Firebase...";

            const formData = new FormData();
            formData.append('usuarioId', 'usuario_teste_html');
            formData.append('descricao', document.getElementById('desc').value);
            formData.append('latitude', document.getElementById('lat').value);
            formData.append('longitude', document.getElementById('long').value);
            formData.append('midia', document.getElementById('arquivo').files[0]);

            try {
                const resposta = await fetch('http://localhost:3000/api/ocorrencias', {
                    method: 'POST',
                    body: formData
                });
                const dados = await resposta.json();
                pre.innerText = JSON.stringify(dados, null, 2);
            } catch (erro) {
                pre.innerText = "Erro ao conectar com o servidor: " + erro.message;
            }
        });
    </script>
</body>
</html>
